<!DOCTYPE html>
<html>

<head>
  <title>Circuit Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="lib/codemirror.css" />
  <link rel="stylesheet" href="theme/monokai.css" />
  <link rel="stylesheet" href="theme/darcula.css" />
  <link rel="stylesheet" href="theme/twilight.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="lib/codemirror.js"></script>
  <script src="lib/matchbrackets.js"></script>
  <script src="lib/verilog.js"></script>
</head>

<body>

  <div class="code-window">
    <header id="code-window-title" class="code-title">top.v</header>

    <textarea id="code" name="code" class="code-editor">
// somador completo

module top(a, b, c_in, s, c_out);

  input a, b;   // bits a somar
  input c_in;   // carry in
  output s;     // soma
  output c_out; // carry out

  wire wx1, wa1, wa2, wa3;

  xor(wx1, a, b);
  xor(s, wx1, c_in);
  and(wa1, a, b);
  and(wa2, a, c_in);
  and(wa3, b, c_in);
  or(c_out, wa1, wa2, wa3);

endmodule</textarea>

    <textarea readonly id="output" name="output" rows="8" spellcheck="false" class="terminal-output"></textarea>

    <button onclick="createAndPassFile()">SAVE</button>
    
    <button onclick="runMain()">RUN</button>

    <button onclick="downloadCode()">DOWNLOAD</button>

    <button onclick="doCall()">TEST CALL</button>
  </div>

  <script>
    var editor = CodeMirror.fromTextArea(document.getElementById("code"), {
      lineNumbers: true,
      matchBrackets: true,
      mode: {
        name: "verilog",
        noIndentKeywords: ["package"]
      }
    });

    editor.setOption("theme", "twilight");

    editor.on('change', function() {
      editor.save();
    });
  </script>

  <script type='text/javascript'>

    var Module = {
      preRun: [],
      postRun: [],
      print: (function () {
        var element = document.getElementById('output');
        if (element) {
          element.value = '';
        }

        return function (text) {
          if (arguments.length > 1) {
            text = Array.prototype.slice.call(arguments).join(' ');
          }
          console.log(text);
          if (element) {
            element.value += text + "\n";
            element.scrollTop = element.scrollHeight; // focus on bottom
          }
        };
      })(),
      printErr: function (text) {
        if (arguments.length > 1) {
          text = Array.prototype.slice.call(arguments).join(' ');
        }
        console.error(text);
      },
      onRuntimeInitialized: function() {
        // Setup FS API
        FS.mkdir('/persist');
        FS.mount(IDBFS, {}, '/persist');
        // Load persistant files (sync from IDBFS to MEMFS), will do nothing on first run
        FS.syncfs(true, function(err) {
          if (err) {
            console.error('Error: ' + err);
          }
        });
        FS.chdir('/persist');
      },
      arguments: ['-v']
    };

    function downloadCode() {
      const content = document.getElementById('code').value;
      const fileBlob = createFileBlob(content, 'text/plain');

      const link = document.createElement('a');
      link.href = URL.createObjectURL(fileBlob);
      link.download = 'top.v';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    function doCall() {
      var str_code = document.getElementById('code').value;
      var ptr = Module.ccall(
        'w_load_module',        // name of C function
        'number',               // return type
        ['string', 'int'],           // argument types
        [str_code, str_code.length]  // actual arguments
      );
      alert('Loaded module at pointer: ' + ptr);
    }

    function runMain() {
      clearOutput();
      var arguments = ['/persist/top.v'];
      Module.callMain(arguments);
    }

    function saveDataArrayToFS(dataArray) {
      // Convert the numeric array back to a string for display in JS
      const decoder = new TextDecoder('utf-8');
      const textContent = decoder.decode(dataArray);

      // Store the file
      let filename = 'top.v';
      let stream = FS.open(filename, 'w+');
      FS.write(stream, dataArray, 0, dataArray.length, 0);
      FS.close(stream);

      // Persist the changes (sync from MEMFS to IDBFS)
      FS.syncfs(false, function(err) {
        if (err) {
          console.error('Error: ' + err);
        }
      });
      // Check the file in IndexedDB section of the browser's web storage inspector. OK
    }

    async function createAndPassFile() {
      const content = document.getElementById('code').value;
      const fileName = 'top.v';
      const mimeType = 'text/plain';

      const fileBlob = createFileBlob(content, mimeType);
      console.log(`Created Blob: ${fileName} (${fileBlob.size} bytes, type: ${fileBlob.type})`);

      // Read the Blob data into a format WebAssembly can use (ArrayBuffer)
      try {
        // Use the built-in Blob method to get data as an ArrayBuffer
        const arrayBuffer = await fileBlob.arrayBuffer();

        // WebAssembly functions often take typed arrays like Uint8Array
        const uint8Array = new Uint8Array(arrayBuffer);

        console.log("Passing Uint8Array to wasm  ...");

        saveDataArrayToFS(uint8Array);

      } catch (error) {
        console.error("Error reading Blob data:", error);
        document.getElementById('output').textContent = "Error processing file: " + error.message;
      }
    }

    function createFileBlob(content, mimeType) {
      return new Blob([content], { type: mimeType });
    }

    function clearOutput() {
      document.getElementById('output').value = '';
    }

  </script>

  <script async type="text/javascript" src="webprogres.js"></script>

</body>

</html>
