<!DOCTYPE html>
<html>
<head>
  <title>Circuit Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="lib/codemirror.css" />
  <link rel="stylesheet" href="theme/monokai.css" />
  <link rel="stylesheet" href="theme/darcula.css" />
  <link rel="stylesheet" href="theme/twilight.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="lib/codemirror.js"></script>
  <script src="lib/matchbrackets.js"></script>
  <script src="lib/verilog.js"></script>
</head>

<body>

<div class="code-window">
  <header class="code-title">top.v</header>

    <textarea id="code" name="code" class="code-editor">
// somador completo

module top(a, b, c_in, s, c_out);

  input a, b;   // bits a somar
  input c_in;   // carry in
  output s;     // soma
  output c_out; // carry out

  wire wx1, wa1, wa2, wa3;

  xor(wx1, a, b);
  xor(s, wx1, c_in);
  and(wa1, a, b);
  and(wa2, a, c_in);
  and(wa3, b, c_in);
  or(c_out, wa1, wa2, wa3);

endmodule
    </textarea>

</div>

<script>
  var editor = CodeMirror.fromTextArea(document.getElementById("code"), {
    lineNumbers: true,
    matchBrackets: true,
    mode: {
      name: "verilog",
      noIndentKeywords: ["package"]
    }
  });
  editor.setOption("theme", "twilight");
</script>

</body>

</html>
