name: "CI build"

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  
  build:
    
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    
    steps:

    - name: Install automake
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y autoconf automake
      if: runner.os == 'macOS'
      run: brew update && brew install autoconf automake libtool pkg-config

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Build target
      run: |
        ./configure
        make

    - name: Archive executables
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.os }}
        path: |
          progres*
          !*.cbp
          !*.c
          !*.h
